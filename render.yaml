services:
  - type: web
    name: argus-x-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        sync: false
      - key: AI_MEMORY_DB_PATH
        value: logs/argus_memory.db
      - key: AI_MEMORY_INDEX_PATH
        value: logs/argus_memory.faiss
