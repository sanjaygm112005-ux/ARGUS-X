<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#0b1120; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="1040" height="75" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="60" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="0.5">ARGUS-X Enterprise Architecture</text>
  <text x="60" y="82" fill="#94a3b8" font-size="13" font-weight="500">Long-Horizon Multi-Camera Person Tracking, Re-Identification &amp; Global Identity Recovery</text>
  <rect x="910" y="47" width="135" height="30" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
  <text x="977" y="67" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">v2.0 Verified</text>

  <!-- Layer 1: Ingestion -->
  <g transform="translate(40, 130)">
    <rect width="210" height="490" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="180" height="35" rx="8" fill="url(#primaryGrad)"/>
    <text x="105" y="38" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">1. Camera Streams</text>

    <!-- Cam 1 -->
    <rect x="20" y="70" width="170" height="75" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="95" fill="#f8fafc" font-size="13" font-weight="700">Camera 1 (cam_1)</text>
    <text x="35" y="115" fill="#94a3b8" font-size="11">Hallway Entry • 25 FPS</text>
    <circle cx="165" cy="92" r="5" fill="#10b981"/>

    <!-- Cam 2 -->
    <rect x="20" y="160" width="170" height="75" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="185" fill="#f8fafc" font-size="13" font-weight="700">Camera 2 (cam_2)</text>
    <text x="35" y="205" fill="#94a3b8" font-size="11">Central Corridor • 25 FPS</text>
    <circle cx="165" cy="182" r="5" fill="#10b981"/>

    <!-- Cam 3 -->
    <rect x="20" y="250" width="170" height="75" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="275" fill="#f8fafc" font-size="13" font-weight="700">Camera 3 (cam_3)</text>
    <text x="35" y="295" fill="#94a3b8" font-size="11">Exit Lobby • 25 FPS</text>
    <circle cx="165" cy="272" r="5" fill="#10b981"/>

    <rect x="20" y="345" width="170" height="120" rx="10" fill="#131c31" stroke="#2563eb" stroke-dasharray="4"/>
    <text x="35" y="375" fill="#38bdf8" font-size="12" font-weight="700">CameraManager</text>
    <text x="35" y="398" fill="#94a3b8" font-size="11">• Non-blocking capture</text>
    <text x="35" y="418" fill="#94a3b8" font-size="11">• Loopback &amp; RTSP</text>
    <text x="35" y="438" fill="#94a3b8" font-size="11">• Disconnect listener</text>
  </g>

  <!-- Flow 1 to 2 -->
  <path d="M 250 250 L 300 250" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <polygon points="300,245 310,250 300,255" fill="#38bdf8"/>

  <!-- Layer 2: Detection & Tracking -->
  <g transform="translate(310, 130)">
    <rect width="230" height="490" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="200" height="35" rx="8" fill="url(#aiGrad)"/>
    <text x="115" y="38" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">2. Detection &amp; Local Tracking</text>

    <!-- Detection Card -->
    <rect x="20" y="70" width="190" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="98" fill="#c084fc" font-size="13" font-weight="700">YOLO11n Detector</text>
    <text x="35" y="120" fill="#94a3b8" font-size="11">• Ultralytics PyTorch</text>
    <text x="35" y="138" fill="#94a3b8" font-size="11">• Bounding-box localization</text>
    <text x="35" y="156" fill="#94a3b8" font-size="11">• Person filtering (class 0)</text>

    <path d="M 115 180 L 115 210" stroke="#a855f7" stroke-width="2" fill="none"/>
    <polygon points="110,210 115,220 120,210" fill="#a855f7"/>

    <!-- BoT-SORT Card -->
    <rect x="20" y="220" width="190" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="248" fill="#c084fc" font-size="13" font-weight="700">BoT-SORT Tracker</text>
    <text x="35" y="270" fill="#94a3b8" font-size="11">• Kalman filter motion</text>
    <text x="35" y="288" fill="#94a3b8" font-size="11">• Camera-isolated track IDs</text>
    <text x="35" y="306" fill="#94a3b8" font-size="11">• Short-horizon continuity</text>

    <path d="M 115 330 L 115 355" stroke="#a855f7" stroke-width="2" fill="none"/>
    <polygon points="110,355 115,365 120,355" fill="#a855f7"/>

    <!-- Tracklet Manager -->
    <rect x="20" y="365" width="190" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="393" fill="#c084fc" font-size="13" font-weight="700">TrackletManager</text>
    <text x="35" y="415" fill="#94a3b8" font-size="11">• Quality-aware frames</text>
    <text x="35" y="433" fill="#94a3b8" font-size="11">• Occlusion mitigation</text>
    <text x="35" y="451" fill="#94a3b8" font-size="11">• Representation buffer</text>
  </g>

  <!-- Flow 2 to 3 -->
  <path d="M 540 250 L 590 250" stroke="#a855f7" stroke-width="3" stroke-linecap="round" fill="none"/>
  <polygon points="590,245 600,250 590,255" fill="#a855f7"/>

  <!-- Layer 3: Feature Extraction & Memory -->
  <g transform="translate(600, 130)">
    <rect width="230" height="490" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="200" height="35" rx="8" fill="url(#storageGrad)"/>
    <text x="115" y="38" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">3. Re-ID &amp; Identity Memory</text>

    <!-- OSNet Extractor -->
    <rect x="20" y="70" width="190" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="98" fill="#34d399" font-size="13" font-weight="700">OSNet x0.25 (Re-ID)</text>
    <text x="35" y="120" fill="#94a3b8" font-size="11">• 512-d L2-normalized vector</text>
    <text x="35" y="138" fill="#94a3b8" font-size="11">• Multi-scale feature maps</text>
    <text x="35" y="156" fill="#94a3b8" font-size="11">• Thread-synchronized CPU</text>

    <path d="M 115 180 L 115 210" stroke="#10b981" stroke-width="2" fill="none"/>
    <polygon points="110,210 115,220 120,210" fill="#10b981"/>

    <!-- FAISS Index -->
    <rect x="20" y="220" width="190" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="248" fill="#34d399" font-size="13" font-weight="700">FAISS IndexFlatIP</text>
    <text x="35" y="270" fill="#94a3b8" font-size="11">• Cosine similarity search</text>
    <text x="35" y="288" fill="#94a3b8" font-size="11">• Vector gallery mapping</text>
    <text x="35" y="306" fill="#94a3b8" font-size="11">• Thread-safe RLock read/write</text>

    <path d="M 115 330 L 115 355" stroke="#10b981" stroke-width="2" fill="none"/>
    <polygon points="110,355 115,365 120,355" fill="#10b981"/>

    <!-- SQLite Metadata Storage -->
    <rect x="20" y="365" width="190" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="393" fill="#34d399" font-size="13" font-weight="700">SQLite Memory DB</text>
    <text x="35" y="415" fill="#94a3b8" font-size="11">• Observations &amp; GID map</text>
    <text x="35" y="433" fill="#94a3b8" font-size="11">• Full audit trail history</text>
    <text x="35" y="451" fill="#94a3b8" font-size="11">• Unresolved queue records</text>
  </g>

  <!-- Flow 3 to 4 -->
  <path d="M 830 250 L 880 250" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
  <polygon points="880,245 890,250 880,255" fill="#10b981"/>

  <!-- Layer 4: Global Identity Association & Web UI -->
  <g transform="translate(890, 130)">
    <rect width="180" height="490" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="150" height="35" rx="8" fill="url(#accentGrad)"/>
    <text x="90" y="38" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4. Association &amp; UI</text>

    <!-- Hungarian Associator -->
    <rect x="15" y="70" width="150" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="98" fill="#fbbf24" font-size="12" font-weight="700">Hungarian Associator</text>
    <text x="25" y="120" fill="#94a3b8" font-size="10">• Appearance cost</text>
    <text x="25" y="136" fill="#94a3b8" font-size="10">• Temporal penalty</text>
    <text x="25" y="152" fill="#94a3b8" font-size="10">• Transition topology</text>
    <text x="25" y="168" fill="#94a3b8" font-size="10">• Motion direction gate</text>

    <!-- Global Identity Manager -->
    <rect x="15" y="195" width="150" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="223" fill="#fbbf24" font-size="12" font-weight="700">Identity Manager</text>
    <text x="25" y="245" fill="#94a3b8" font-size="10">• Lifecycle state machine</text>
    <text x="25" y="261" fill="#94a3b8" font-size="10">• Conflict blocking</text>
    <text x="25" y="277" fill="#94a3b8" font-size="10">• Identity recovery</text>
    <text x="25" y="293" fill="#94a3b8" font-size="10">• Manual review queue</text>

    <!-- Fullstack Web UI -->
    <rect x="15" y="320" width="150" height="145" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="348" fill="#fbbf24" font-size="12" font-weight="700">Web App &amp; API</text>
    <text x="25" y="370" fill="#94a3b8" font-size="10">• FastAPI Backend (Py3.9)</text>
    <text x="25" y="386" fill="#94a3b8" font-size="10">• React + Vite + Tailwind</text>
    <text x="25" y="402" fill="#94a3b8" font-size="10">• Interactive Zoom &amp; Pan</text>
    <text x="25" y="418" fill="#94a3b8" font-size="10">• WebSocket stream feed</text>
    <text x="25" y="434" fill="#94a3b8" font-size="10">• Light &amp; Dark mode</text>
    <text x="25" y="450" fill="#94a3b8" font-size="10">• RBAC: Admin / Operator</text>
  </g>
</svg>